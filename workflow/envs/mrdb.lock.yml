# MicroRhodoDB v1.5.0 pinned build environment.
# Exported with: conda env export --no-builds
#
# NOTE on DIAMOND version: features_v140.py documents the original v1.4.0 scorer as having
# used DIAMOND 2.2.8 for seed homology (e_homology axis). DIAMOND 2.2.8 is not published on
# bioconda/conda-forge as of this release; this environment pins the latest bioconda release,
# DIAMOND 2.1.10, which was used for all v1.5.0 feature extraction, external-set scoring and
# hard-negative mining. The two versions are not guaranteed bit-identical; this is disclosed
# in RESPONSE_TO_REVIEWERS.md (comment 6) and release_metadata. Do not silently upgrade this
# pin without re-validating external_validation and holdout_metric outputs.
