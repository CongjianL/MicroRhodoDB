# MicroRhodoDB pinned environment for macOS on Apple silicon (osx-arm64).
# Create with: conda env create -f workflow/envs/mrdb.macos-arm64.yml && conda activate mrdb
#
# mrdb.lock.yml is a full Linux export (it contains linux-64-only packages such as ld_impl_linux-64 and alsa-lib)
# and does not solve on macOS. This file pins the same versions of every tool and Python package the code uses,
# taken from mrdb.lock.yml, and lets conda choose the platform libraries. The lock file remains the reference
# environment for the release; see the DIAMOND note there before changing any pin here.
name: mrdb
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.16
  - hmmer=3.4
  - diamond=2.1.10
  - mafft=7.526
  - iqtree=2.3.6
  - epa-ng=0.3.8
  - gappa=0.9.0
  - mmseqs2=18.8cc5c
  - clipkit=2.14.0
  - snakemake-minimal=8.30.0
  - biopython=1.88
  - ete3=3.1.3
  - numpy=2.4.6
  - pandas=3.0.6
  - scipy=1.17.1
  - scikit-learn=1.9.1
  - statsmodels=0.15.0
  - matplotlib=3.11.2
  - requests=2.34.2
  - pip
  - pip:
      - iniconfig==2.3.0
      - pluggy==1.6.0
      - pygments==2.21.0
      - pyhmmer==0.12.3
      - pytest==9.1.1
