# PR-7: non-production preview of the deployment artifact. Builds exactly what deploy-site.yml would publish,
# verifies it offline, runs the browser smoke tests against it (served like GitHub Pages under /MicroRhodoDB/),
# reports the release-blocker checklist (report mode: never blocks previews) and uploads the artifact for
# inspection. It has read-only permissions, no environment, no secrets, and never touches GitHub Pages.
# Inspect locally: download the artifact, extract mrdb-site.tar.gz and run
#   python web/scripts/serve_artifact.py <dir> 4173   ->  http://127.0.0.1:4173/MicroRhodoDB/site/
name: site-preview

on:
  pull_request:
    paths:
      - "tools/export_web_data.py"
      - "web/**"
      - "index.html"
      - "README.md"
      - "LICENSE"
      - "CITATION.cff"
      - "MAINTENANCE.md"
      - "CHANGELOG.md"
      - "BINARIES.md"
      - "docs/RELEASE_HISTORY.md"
      - "docs/website/release_blockers.json"
      - "tools/mrdb_search.py"
      - "refpkg/MR_RT_003/**"
      - "releases/**"
      - ".github/workflows/site-preview.yml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Python dependencies (pinned)
        run: python -m pip install "pandas==3.0.6" "numpy==2.4.6" "pytest==9.1.1" "jsonschema==4.26.0" "pyyaml==6.0.3"
      - name: Fetch and verify release database (BLOCKED_DATA_SOURCE if absent or different)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p releases/v1.6.1/db
          gh release download v1.6.1 \
            --repo CongjianL/MicroRhodoDB \
            --pattern microrhododb_v1.6.1.sqlite \
            --dir releases/v1.6.1/db
          python web/scripts/fetch_release_db.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies (lockfile)
        working-directory: web
        run: npm ci
      - name: Build and verify the artifact (same command as production, without the clean-tree requirement)
        run: python web/scripts/build_site_artifact.py --out "$RUNNER_TEMP/site" --tarball "$RUNNER_TEMP/preview/mrdb-site.tar.gz" --json "$RUNNER_TEMP/preview/build.json"
      - name: Release-blocker checklist (report only; previews are never blocked)
        run: python web/scripts/release_gate.py --mode report --json "$RUNNER_TEMP/preview/release_gate.json"
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Smoke tests on the artifact
        working-directory: web
        env:
          SMOKE_ARTIFACT: ${{ runner.temp }}/site
          SMOKE_REPORT_DIR: ${{ runner.temp }}/preview/smoke
        run: npx playwright test -c playwright.smoke.config.ts
      - name: Summary
        if: always()
        run: |
          {
            echo "## site-preview (not deployed)"
            if [ -f "$RUNNER_TEMP/site/site/BUILD_INFO.json" ]; then
              echo '```json'; cat "$RUNNER_TEMP/site/site/BUILD_INFO.json"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload preview artifact and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mrdb-site-preview-${{ github.sha }}
          path: ${{ runner.temp }}/preview/
          retention-days: 14
          if-no-files-found: warn
