# PR-1: validate the deterministic web data export. PR-2/PR-3: build the website and run unit + browser tests.
# PR-4: gate G4 (tests/test_web_phylogeny.py) reconciles the phylogeny explorer export with refpkg and the DB.
# PR-4a: tests/test_web_pr4a.py (formal assignments vs placements, schema 1.3.0).
# PR-3: structure requests (RCSB/AFDB) are mocked from committed fixtures; @live tests are excluded (E2E_LIVE unset).
# Validation only - no Pages, no deploy (PR-7).
# Data source: the official v1.6.0 GitHub Release asset, verified against BINARIES.md (SHA-256 + size).
# Until that Release is published, the fetch step fails with BLOCKED_DATA_SOURCE (by design).
name: web-data

on:
  pull_request:
    paths:
      - "tools/export_web_data.py"
      - "web/**"
      - "tests/test_web_export.py"
      - "tests/test_fetch_release_db.py"
      - "tests/test_web_phylogeny.py"
      - "tests/test_web_pr4a.py"
      - "docs/website/**"
      - ".github/workflows/web-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pandas==3.0.6" "numpy==2.4.6" "pytest==9.1.1" "jsonschema==4.26.0"
      - name: Fetch and verify release database (BLOCKED_DATA_SOURCE if the Release is absent)
        run: python web/scripts/fetch_release_db.py
      - name: Export web data
        run: python tools/export_web_data.py --out web/public/data
      - name: Validate export (gates G1 and G4)
        run: python -m pytest -q tests/test_web_export.py tests/test_fetch_release_db.py tests/test_web_phylogeny.py tests/test_web_pr4a.py
      - name: Check generated TypeScript types
        run: python web/scripts/schema_to_ts.py --check
      - name: Verify committed structure fixtures (PR-3, offline SHA-256 check)
        run: python web/scripts/fetch_structure_fixtures.py --check
      # Frontend (added locally in PR-2, extended in PR-3 and PR-4; has not yet run on GitHub)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build (base /MicroRhodoDB/site/)
        working-directory: web
        run: npm run build
      - name: Unit tests (Vitest)
        working-directory: web
        run: npx vitest run
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests (Playwright, mocked structures; @live excluded)
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
