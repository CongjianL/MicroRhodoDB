# PR-1: validate the deterministic web data export. PR-2/PR-3: build the website and run unit + browser tests.
# PR-4: gate G4 (tests/test_web_phylogeny.py) reconciles the phylogeny explorer export with refpkg and the DB.
# PR-4a: tests/test_web_pr4a.py (formal assignments vs placements, schema 1.3.0).
# PR-5/PR-5a: tests/test_web_pr5.py, tests/test_web_pr5a.py (keyed SQL reconciliation, drilldown golden sets).
# PR-3: structure requests (RCSB/AFDB) are mocked from committed fixtures; @live tests are excluded (E2E_LIVE unset).
# PR-6: independent scientific audit + mutation self-test. PR-6a: portable scratch dirs; triggers also cover the
# repository metadata the exporter publishes on the website (README, LICENSE, CITATION, MAINTENANCE, CHANGELOG,
# BINARIES) and the frozen inputs it reads; tests/test_web_pr6a.py validates this file.
# PR-7: actions pinned to commit SHAs; builds and verifies (never deploys) the Pages artifact.
# PR-7c.2: tests/test_web_pr7c2.py (habitat sidecar from the pinned PR-7c.1a tables; tools/habitat_export/**).
# Validation only - no Pages, no deploy (deployment is deploy-site.yml, manual dispatch with a protected environment).
# Data source: the official v1.6.0 GitHub Release asset, verified against BINARIES.md (SHA-256 + size); the fetch
# step fails with BLOCKED_DATA_SOURCE if the asset is missing or differs.
name: web-data

on:
  pull_request:
    paths:
      - "tools/export_web_data.py"
      - "tools/habitat_export/**"
      - "web/**"
      - "tests/test_web_*.py"
      - "tests/test_fetch_release_db.py"
      - "tests/data/web_*"
      - "docs/website/**"
      - "README.md"
      - "LICENSE"
      - "CITATION.cff"
      - "MAINTENANCE.md"
      - "CHANGELOG.md"
      - "BINARIES.md"
      - "index.html"
      - "docs/RELEASE_HISTORY.md"
      - "tools/mrdb_search.py"
      - "refpkg/MR_RT_003/**"
      - "releases/**"
      - ".github/workflows/web-data.yml"
      - ".github/workflows/deploy-site.yml"
      - ".github/workflows/site-preview.yml"
  push:
    branches: [main]
    paths:
      - "tools/export_web_data.py"
      - "tools/habitat_export/**"
      - "web/**"
      - "tests/test_web_*.py"
      - "tests/test_fetch_release_db.py"
      - "tests/data/web_*"
      - "docs/website/**"
      - "README.md"
      - "LICENSE"
      - "CITATION.cff"
      - "MAINTENANCE.md"
      - "CHANGELOG.md"
      - "BINARIES.md"
      - "index.html"
      - "docs/RELEASE_HISTORY.md"
      - "tools/mrdb_search.py"
      - "refpkg/MR_RT_003/**"
      - "releases/**"
      - ".github/workflows/web-data.yml"
      - ".github/workflows/deploy-site.yml"
      - ".github/workflows/site-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # PR-7b: require the complete historical rollback baseline before running tests.
      - name: Verify legacy rollback baseline
        run: |
          set -eu
          LEGACY_SHA="fab9182044c45670c869c8778fd8d48932bd35b8"
          git cat-file -e "${LEGACY_SHA}^{commit}"
          git cat-file -e "${LEGACY_SHA}:site/app.js"
          git cat-file -e "${LEGACY_SHA}:site/data.js"
          echo "Legacy rollback baseline verified: ${LEGACY_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pandas==3.0.6" "numpy==2.4.6" "pytest==9.1.1" "jsonschema==4.26.0" "pyyaml==6.0.3"
      - name: Fetch and verify release database (BLOCKED_DATA_SOURCE if the Release is absent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p releases/v1.6.0/db
          gh release download v1.6.0 \
            --repo CongjianL/MicroRhodoDB \
            --pattern microrhododb_v1.6.0.sqlite \
            --dir releases/v1.6.0/db
          python web/scripts/fetch_release_db.py
      - name: Export web data
        run: python tools/export_web_data.py --out web/public/data
      - name: Validate export (gates G1, G4 and G5)
        run: python -m pytest -q tests/test_web_export.py tests/test_fetch_release_db.py tests/test_web_phylogeny.py tests/test_web_pr4a.py tests/test_web_pr5.py tests/test_web_pr5a.py tests/test_web_pr6a.py tests/test_web_pr7.py tests/test_web_pr7c2.py
      - name: Check drilldown golden accession sets (PR-5a)
        run: python web/scripts/pr5a_drilldown_golden.py --check
      - name: Independent scientific audit and its mutation self-test (PR-6)
        run: |
          python web/scripts/pr6_scientific_audit.py --out "$RUNNER_TEMP/pr6"
          python web/scripts/pr6_audit_mutations.py --out "$RUNNER_TEMP/pr6"
      - name: Check generated TypeScript types
        run: python web/scripts/schema_to_ts.py --check
      - name: Verify committed structure fixtures (PR-3, offline SHA-256 check)
        run: python web/scripts/fetch_structure_fixtures.py --check
      # Frontend (PR-2 onward; these steps passed on GitHub for PR-1..PR-3 runs, later additions are unexercised remotely)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build (base /MicroRhodoDB/site/)
        working-directory: web
        run: npm run build
      - name: Unit tests (Vitest)
        working-directory: web
        run: npx vitest run
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests (Playwright, mocked structures; @live excluded)
        working-directory: web
        run: npx playwright test
      # PR-7: assemble the Pages artifact from this build (provenance stamp, SHA256SUMS, deterministic tarball),
      # verify it offline (V1-V11) and run the artifact tests against it. MRDB_REQUIRE_ARTIFACT=1 turns a missing
      # artifact into a failure instead of a skip. Never deploys.
      - name: Build and verify the site artifact (PR-7, non-production)
        run: python web/scripts/build_site_artifact.py --out "$RUNNER_TEMP/site-artifact" --tarball "$RUNNER_TEMP/site-artifact.tar.gz" --skip-export
      - name: Artifact, rollback and gate tests (PR-7)
        env:
          MRDB_SITE_ARTIFACT: ${{ runner.temp }}/site-artifact
          MRDB_REQUIRE_ARTIFACT: "1"
        run: python -m pytest -q tests/test_web_pr7.py
      - name: Release-blocker report (never blocks validation)
        run: python web/scripts/release_gate.py --mode report
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-playwright
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
