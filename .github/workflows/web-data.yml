# PR-1: validate the deterministic web data export. PR-2/PR-3: build the website and run unit + browser tests.
# PR-4: gate G4 (tests/test_web_phylogeny.py) reconciles the phylogeny explorer export with refpkg and the DB.
# PR-4a: tests/test_web_pr4a.py (formal assignments vs placements, schema 1.3.0).
# PR-5/PR-5a: tests/test_web_pr5.py, tests/test_web_pr5a.py (keyed SQL reconciliation, drilldown golden sets).
# PR-3: structure requests (RCSB/AFDB) are mocked from committed fixtures; @live tests are excluded (E2E_LIVE unset).
# PR-6: independent scientific audit + mutation self-test. PR-6a: portable scratch dirs; triggers also cover the
# repository metadata the exporter publishes on the website (README, LICENSE, CITATION, MAINTENANCE, CHANGELOG,
# BINARIES) and the frozen inputs it reads; tests/test_web_pr6a.py validates this file.
# Validation only - no Pages, no deploy (deployment is a separate, manually authorised workflow).
# Data source: the official v1.6.0 GitHub Release asset, verified against BINARIES.md (SHA-256 + size); the fetch
# step fails with BLOCKED_DATA_SOURCE if the asset is missing or differs.
name: web-data

on:
  pull_request:
    paths:
      - "tools/export_web_data.py"
      - "web/**"
      - "tests/test_web_*.py"
      - "tests/test_fetch_release_db.py"
      - "tests/data/web_*"
      - "docs/website/**"
      - "README.md"
      - "LICENSE"
      - "CITATION.cff"
      - "MAINTENANCE.md"
      - "CHANGELOG.md"
      - "BINARIES.md"
      - "index.html"
      - "docs/RELEASE_HISTORY.md"
      - "tools/mrdb_search.py"
      - "refpkg/MR_RT_003/**"
      - "releases/**"
      - ".github/workflows/web-data.yml"
  push:
    branches: [main]
    paths:
      - "tools/export_web_data.py"
      - "web/**"
      - "tests/test_web_*.py"
      - "tests/test_fetch_release_db.py"
      - "tests/data/web_*"
      - "docs/website/**"
      - "README.md"
      - "LICENSE"
      - "CITATION.cff"
      - "MAINTENANCE.md"
      - "CHANGELOG.md"
      - "BINARIES.md"
      - "index.html"
      - "docs/RELEASE_HISTORY.md"
      - "tools/mrdb_search.py"
      - "refpkg/MR_RT_003/**"
      - "releases/**"
      - ".github/workflows/web-data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pandas==3.0.6" "numpy==2.4.6" "pytest==9.1.1" "jsonschema==4.26.0" "pyyaml==6.0.3"
      - name: Fetch and verify release database (BLOCKED_DATA_SOURCE if the Release is absent)
        run: python web/scripts/fetch_release_db.py
      - name: Export web data
        run: python tools/export_web_data.py --out web/public/data
      - name: Validate export (gates G1, G4 and G5)
        run: python -m pytest -q tests/test_web_export.py tests/test_fetch_release_db.py tests/test_web_phylogeny.py tests/test_web_pr4a.py tests/test_web_pr5.py tests/test_web_pr5a.py tests/test_web_pr6a.py
      - name: Check drilldown golden accession sets (PR-5a)
        run: python web/scripts/pr5a_drilldown_golden.py --check
      - name: Independent scientific audit and its mutation self-test (PR-6)
        run: |
          python web/scripts/pr6_scientific_audit.py --out "$RUNNER_TEMP/pr6"
          python web/scripts/pr6_audit_mutations.py --out "$RUNNER_TEMP/pr6"
      - name: Check generated TypeScript types
        run: python web/scripts/schema_to_ts.py --check
      - name: Verify committed structure fixtures (PR-3, offline SHA-256 check)
        run: python web/scripts/fetch_structure_fixtures.py --check
      # Frontend (PR-2 onward; these steps passed on GitHub for PR-1..PR-3 runs, later additions are unexercised remotely)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build (base /MicroRhodoDB/site/)
        working-directory: web
        run: npm run build
      - name: Unit tests (Vitest)
        working-directory: web
        run: npx vitest run
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests (Playwright, mocked structures; @live excluded)
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
