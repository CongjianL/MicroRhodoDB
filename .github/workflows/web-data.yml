# PR-1: validate the deterministic web data export. Validation only - no build, no Pages, no deploy.
# Data source: the official v1.6.0 GitHub Release asset, verified against BINARIES.md (SHA-256 + size).
# Until that Release is published, the fetch step fails with BLOCKED_DATA_SOURCE (by design).
name: web-data

on:
  pull_request:
    paths:
      - "tools/export_web_data.py"
      - "web/**"
      - "tests/test_web_export.py"
      - "tests/test_fetch_release_db.py"
      - "docs/website/**"
      - ".github/workflows/web-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pandas==3.0.6" "numpy==2.4.6" "pytest==9.1.1" "jsonschema==4.26.0"
      - name: Fetch and verify release database (BLOCKED_DATA_SOURCE if the Release is absent)
        run: python web/scripts/fetch_release_db.py
      - name: Export web data
        run: python tools/export_web_data.py --out web/public/data
      - name: Validate export (gate G1)
        run: python -m pytest -q tests/test_web_export.py tests/test_fetch_release_db.py
      - name: Check generated TypeScript types
        run: python web/scripts/schema_to_ts.py --check
